set timeout_style=menu
set timeout=8
set default=0
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

menuentry 'Essayer Sillage — disques en lecture seule' {
    linux /casper/vmlinuz boot=casper nopersistent sillage_protect=1 quiet ---
    initrd /casper/initrd
}

menuentry 'Essayer Sillage — secours Intel, disques en lecture seule' {
    linux /casper/vmlinuz boot=casper nopersistent sillage_protect=1 module_blacklist=nvidia,nvidia_modeset,nvidia_drm,nvidia_uvm,nouveau quiet ---
    initrd /casper/initrd
}

menuentry 'Installer Sillage — ouvrir une session avec accès aux disques' {
    linux /casper/vmlinuz boot=casper nopersistent sillage_install=1 quiet ---
    initrd /casper/initrd
}
